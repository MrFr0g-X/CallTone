name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          DB_HOST: ""
          SECRET_KEY: "ci-secret-not-for-production"
        run: pytest backend/tests/ -v --no-cov

      - name: Run skill validation tests
        run: pytest models/skill_implementation/tests/ -v --no-cov

      - name: Run security scanner tests
        run: pytest models/LAYER_2/security/tests/ -v --no-cov

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calltone-UI
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: calltone-UI/package-lock.json

      - name: Install
        run: npm ci

      - name: Vitest
        run: npm test -- --run

      - name: Build
        run: npm run build
