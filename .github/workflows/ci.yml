name: CI

on:
  push:
    branches:
      - main
      - "integration/**"
      - "release/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest + OpenAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_HOST: ""
      SECRET_KEY: "ci-secret-not-for-production"
      PIPELINE_QUEUE_AUTOSTART: "0"
      MODEL_SERVER_URL: "http://127.0.0.1:8090"
      MODEL_SERVER_TOKEN: "ci-model-token"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest backend/tests/ -v --no-cov

      - name: Export OpenAPI artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "backend")
          from app.main import app
          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/openapi.json").write_text(
              json.dumps(app.openapi(), indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-json
          path: artifacts/openapi.json

  model-server:
    name: model-server (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODEL_SERVER_TOKEN: "ci-model-token"
      ALLOWED_IPS: "testclient,127.0.0.1"
      PIPELINE_TIMEOUT_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: model_server/requirements.txt

      - name: Install model-server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r model_server/requirements.txt

      - name: Run model-server tests
        run: pytest model_server/tests/ -v --no-cov

  skills-and-security:
    name: Layer 2 skills/security (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run skill validation tests
        run: pytest models/skill_implementation/tests/ -v --no-cov

      - name: Run Layer 2 security tests
        env:
          PYTHONPATH: models:models/skill_implementation:scripts/security
        run: pytest models/LAYER_2/security/tests/ -v --no-cov

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: calltone-UI
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: calltone-UI/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run

      - name: Build production frontend
        env:
          VITE_API_BASE_URL: ${{ vars.CI_API_BASE_URL || 'https://api.calltone.tech' }}
        run: npm run build
