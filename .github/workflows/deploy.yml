name: Deploy

# CallTone is a 3-tier deployment:
#   Tier 1: React frontend on Hetzner shared webspace.
#   Tier 2: FastAPI backend + PostgreSQL on Hetzner VPS.
#   Tier 3: GPU model server on Vast.ai, reached through an SSH tunnel.
#
# Policy:
#   - Staging deploys automatically from main after CI passes.
#   - Production deploys only by manual dispatch of a vX.Y.Z tag.
#     This keeps manual approval even when GitHub Environment reviewer rules
#     are unavailable on the repository plan.
#   - GPU instances are not rebuilt on every deploy; this workflow verifies
#     their tunnel/health through the backend smoke endpoint.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        type: choice
        options: [staging, production]
      version_tag:
        description: "Production tag to deploy, e.g. v1.0.0. Required when target=production."
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: deploy staging
    if: |
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch'
        && github.event.inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_FRONTEND_URL }}
    steps:
      - name: Resolve source SHA
        id: src
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.src.outputs.sha }}

      - name: Build frontend
        working-directory: calltone-UI
        env:
          VITE_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Check staging deployment config
        id: staging_config
        env:
          FRONTEND_SSH_KEY: ${{ secrets.STAGING_WEBSPACE_SSH_KEY }}
          FRONTEND_HOST: ${{ secrets.STAGING_WEBSPACE_HOST }}
          FRONTEND_USER: ${{ secrets.STAGING_WEBSPACE_USER }}
          FRONTEND_PORT: ${{ secrets.STAGING_WEBSPACE_PORT }}
          FRONTEND_PATH: ${{ secrets.STAGING_WEBSPACE_PATH }}
          BACKEND_SSH_KEY: ${{ secrets.STAGING_BACKEND_SSH_KEY }}
          BACKEND_HOST: ${{ secrets.STAGING_BACKEND_HOST }}
          BACKEND_USER: ${{ secrets.STAGING_BACKEND_USER }}
          BACKEND_PORT: ${{ secrets.STAGING_BACKEND_PORT }}
          BACKEND_PATH: ${{ secrets.STAGING_BACKEND_PATH }}
          FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
          BACKEND_HEALTH_URL: ${{ vars.STAGING_BACKEND_HEALTH_URL }}
        run: |
          frontend_ready=true
          for name in FRONTEND_SSH_KEY FRONTEND_HOST FRONTEND_USER FRONTEND_PORT FRONTEND_PATH; do
            if [ -z "${!name}" ]; then frontend_ready=false; fi
          done

          backend_ready=true
          for name in BACKEND_SSH_KEY BACKEND_HOST BACKEND_USER BACKEND_PORT BACKEND_PATH; do
            if [ -z "${!name}" ]; then backend_ready=false; fi
          done

          smoke_ready=true
          for name in FRONTEND_URL BACKEND_HEALTH_URL; do
            if [ -z "${!name}" ]; then smoke_ready=false; fi
          done

          echo "frontend_ready=${frontend_ready}" >> "$GITHUB_OUTPUT"
          echo "backend_ready=${backend_ready}" >> "$GITHUB_OUTPUT"
          echo "smoke_ready=${smoke_ready}" >> "$GITHUB_OUTPUT"

          if [ "${frontend_ready}" != "true" ]; then
            echo "::notice::Skipping staging frontend deploy because STAGING_WEBSPACE_* secrets are not fully configured."
          fi
          if [ "${backend_ready}" != "true" ]; then
            echo "::notice::Skipping staging backend deploy because STAGING_BACKEND_* secrets are not fully configured."
          fi
          if [ "${smoke_ready}" != "true" ]; then
            echo "::notice::Skipping staging smoke test because STAGING_FRONTEND_URL and/or STAGING_BACKEND_HEALTH_URL variables are not configured."
          fi

      - name: Deploy frontend to staging webspace
        if: steps.staging_config.outputs.frontend_ready == 'true'
        env:
          SSH_KEY: ${{ secrets.STAGING_WEBSPACE_SSH_KEY }}
          HOST: ${{ secrets.STAGING_WEBSPACE_HOST }}
          USER: ${{ secrets.STAGING_WEBSPACE_USER }}
          PORT: ${{ secrets.STAGING_WEBSPACE_PORT }}
          PATH_REMOTE: ${{ secrets.STAGING_WEBSPACE_PATH }}
        run: bash scripts/ci/rsync_dir.sh calltone-UI/dist/ "$USER@$HOST:$PATH_REMOTE" "$PORT" "$SSH_KEY"

      - name: Deploy backend to staging VPS
        if: steps.staging_config.outputs.backend_ready == 'true'
        env:
          SSH_KEY: ${{ secrets.STAGING_BACKEND_SSH_KEY }}
          HOST: ${{ secrets.STAGING_BACKEND_HOST }}
          USER: ${{ secrets.STAGING_BACKEND_USER }}
          PORT: ${{ secrets.STAGING_BACKEND_PORT }}
          PATH_REMOTE: ${{ secrets.STAGING_BACKEND_PATH }}
          RESTART_CMD: ${{ vars.STAGING_BACKEND_RESTART_CMD || 'sudo systemctl restart calltone-backend' }}
        run: |
          bash scripts/ci/rsync_repo.sh "$USER@$HOST:$PATH_REMOTE" "$PORT" "$SSH_KEY"
          bash scripts/ci/remote_exec.sh "$USER@$HOST" "$PORT" "$SSH_KEY" "cd '$PATH_REMOTE' && ${RESTART_CMD}"

      - name: Smoke staging
        if: steps.staging_config.outputs.smoke_ready == 'true'
        env:
          FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
          BACKEND_HEALTH_URL: ${{ vars.STAGING_BACKEND_HEALTH_URL }}
        run: bash scripts/ci/smoke_http.sh

  deploy-production:
    name: deploy production
    if: |
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.PROD_FRONTEND_URL }}
    steps:
      - name: Validate production tag input
        id: prodtag
        run: |
          TAG="${{ github.event.inputs.version_tag }}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9]+)?$'; then
            echo "::error::target=production requires version_tag like v1.0.0"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.prodtag.outputs.tag }}
          fetch-depth: 0

      - name: Resolve deploy SHA
        id: deploysha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify CI passed for this SHA
        uses: actions/github-script@v9
        env:
          DEPLOY_SHA: ${{ steps.deploysha.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: process.env.DEPLOY_SHA,
              status: 'success',
            });
            const ciPassed = data.workflow_runs.some(r => r.name === 'CI');
            if (!ciPassed) {
              core.setFailed(`No successful CI run found for ${process.env.DEPLOY_SHA}. Refusing production deploy.`);
            }

      - name: Build frontend
        working-directory: calltone-UI
        env:
          VITE_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to production webspace
        env:
          SSH_KEY: ${{ secrets.PROD_WEBSPACE_SSH_KEY }}
          HOST: ${{ secrets.PROD_WEBSPACE_HOST }}
          USER: ${{ secrets.PROD_WEBSPACE_USER }}
          PORT: ${{ secrets.PROD_WEBSPACE_PORT }}
          PATH_REMOTE: ${{ secrets.PROD_WEBSPACE_PATH }}
        run: bash scripts/ci/rsync_dir.sh calltone-UI/dist/ "$USER@$HOST:$PATH_REMOTE" "$PORT" "$SSH_KEY"

      - name: Deploy backend to production VPS
        env:
          SSH_KEY: ${{ secrets.PROD_BACKEND_SSH_KEY }}
          HOST: ${{ secrets.PROD_BACKEND_HOST }}
          USER: ${{ secrets.PROD_BACKEND_USER }}
          PORT: ${{ secrets.PROD_BACKEND_PORT }}
          PATH_REMOTE: ${{ secrets.PROD_BACKEND_PATH }}
          RESTART_CMD: ${{ vars.PROD_BACKEND_RESTART_CMD || 'sudo systemctl restart calltone-backend' }}
        run: |
          bash scripts/ci/rsync_repo.sh "$USER@$HOST:$PATH_REMOTE" "$PORT" "$SSH_KEY"
          bash scripts/ci/remote_exec.sh "$USER@$HOST" "$PORT" "$SSH_KEY" "cd '$PATH_REMOTE' && ${RESTART_CMD}"

      - name: Smoke production
        env:
          FRONTEND_URL: ${{ vars.PROD_FRONTEND_URL }}
          BACKEND_HEALTH_URL: ${{ vars.PROD_BACKEND_HEALTH_URL }}
        run: bash scripts/ci/smoke_http.sh
