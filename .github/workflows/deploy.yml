name: Deploy

# ────────────────────────────────────────────────────────────────────────────
# CallTone deployment workflow
#
#  Staging  : auto on push to `main`, after CI passes (workflow_run)
#  Prod     : on tag `v*.*.*`, gated by GitHub `production` environment
#             (manual approval), after CI passes
#
# Both jobs run on a SELF-HOSTED runner labelled `gpu-stage` / `gpu-prod`
# (the GPU box). The runners are registered as part of the one-time
# bootstrap in docs/DEPLOYMENT_PLAN.md §10.
#
# Atomicity: `docker compose up -d --build` swaps the new container in
# only after a successful build. The previous container keeps serving
# until the new one is healthy.
# ────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy"
        required: true
        type: choice
        options: [staging, prod]

# Least-privilege: this workflow needs to read the repo and write deploy
# statuses; it does NOT need write access to code.
permissions:
  contents: read
  deployments: write

# Prevent overlapping deploys to the same environment.
concurrency:
  group: deploy-${{ github.event.inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging') }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────── staging ─────────────────────────────────
  deploy-staging:
    name: deploy → staging
    if: |
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch'
        && github.event.inputs.target == 'staging')
    runs-on: [self-hosted, gpu-stage]
    environment:
      name: staging
      url: https://stage.calltone.local
    timeout-minutes: 15
    steps:
      - name: Resolve commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (fast-forward only)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 1

      - name: Verify deploy host layout
        run: |
          set -euo pipefail
          test -d /opt/calltone/staging || {
            echo "::error::/opt/calltone/staging not provisioned. See DEPLOYMENT_PLAN.md §10."
            exit 1
          }
          test -f /opt/calltone/staging/.env.staging || {
            echo "::error::missing /opt/calltone/staging/.env.staging"
            exit 1
          }

      - name: Sync source into deploy dir
        working-directory: /opt/calltone/staging
        run: |
          set -euo pipefail
          git fetch --quiet origin
          git checkout --quiet ${{ steps.sha.outputs.sha }}

      - name: Build & start (atomic swap)
        working-directory: /opt/calltone/staging
        run: |
          set -euo pipefail
          docker compose \
            --env-file .env.staging \
            -f docker-compose.yml \
            -f docker-compose.staging.yml \
            up -d --build --remove-orphans

      - name: Smoke test
        working-directory: /opt/calltone/staging
        env:
          SMOKE_BASE_URL: http://localhost:8001
          SMOKE_ADMIN_EMAIL: admin@calltone.ai
          SMOKE_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: bash scripts/post_deploy_smoke.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Staging deploy of ${{ steps.sha.outputs.sha }} failed."
          echo "Previous container is still running (atomic swap aborted)."

  # ─────────────────────────────────── prod ──────────────────────────────────
  deploy-prod:
    name: deploy → prod
    if: |
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch'
        && github.event.inputs.target == 'prod')
    runs-on: [self-hosted, gpu-prod]
    environment:
      name: production       # GitHub-protected — requires manual approval
      url: https://calltone.local
    timeout-minutes: 20
    steps:
      - name: Verify CI passed for this ref
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
              status: 'success',
            });
            const ciPassed = data.workflow_runs.some(r => r.name === 'CI');
            if (!ciPassed) {
              core.setFailed(`No successful CI run found for ${context.sha}. Refusing to deploy.`);
            }

      - name: Checkout tagged ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify deploy host layout
        run: |
          set -euo pipefail
          test -d /opt/calltone/prod
          test -f /opt/calltone/prod/.env.prod
          test "$(stat -c %a /opt/calltone/prod/.env.prod)" = "600" || {
            echo "::error::.env.prod must be mode 600"
            exit 1
          }

      - name: Capture previous tag (for rollback log)
        id: prev
        working-directory: /opt/calltone/prod
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREV"

      - name: Sync source into deploy dir
        working-directory: /opt/calltone/prod
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin
          git checkout --quiet ${{ github.ref_name }}

      - name: Build & start (atomic swap)
        working-directory: /opt/calltone/prod
        run: |
          set -euo pipefail
          docker compose \
            --env-file .env.prod \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up -d --build --remove-orphans

      - name: Smoke test
        working-directory: /opt/calltone/prod
        env:
          SMOKE_BASE_URL: http://localhost:8000
          SMOKE_ADMIN_EMAIL: admin@calltone.ai
          SMOKE_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
        run: bash scripts/post_deploy_smoke.sh

      - name: Auto-rollback on smoke failure
        if: failure()
        working-directory: /opt/calltone/prod
        run: |
          set -euo pipefail
          echo "::warning::Smoke failed. Rolling back to ${{ steps.prev.outputs.prev }}."
          if [ "${{ steps.prev.outputs.prev }}" != "none" ]; then
            git checkout --quiet ${{ steps.prev.outputs.prev }}
            docker compose \
              --env-file .env.prod \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --build --remove-orphans
          else
            echo "::error::No previous tag to roll back to. Manual intervention required."
            exit 1
          fi
