name: Deploy CallTone UI

on:
  push:
    branches: [deploy]
    paths:
      - 'calltone-UI/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: calltone-UI/package-lock.json

      - name: Install dependencies
        working-directory: calltone-UI
        run: npm ci

      - name: Build
        working-directory: calltone-UI
        run: npm run build

      - name: Deploy via rsync
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT }} -i /tmp/deploy_key" \
            calltone-UI/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}
          rm /tmp/deploy_key
