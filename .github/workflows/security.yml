name: Security

# Lightweight security checks that should never block a merge silently.
# Bandit output is kept as a SARIF artifact because GitHub code scanning is
# not enabled on every repository/plan.

on:
  push:
    branches:
      - main
      - "integration/**"
      - "release/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"     # Mondays 04:17 UTC — odd minute to avoid runner stampede
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: bandit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install bandit[sarif]
      - name: Run Bandit
        # -ll = report medium+high severity only; tests/ excluded (assert is fine)
        run: |
          bandit -r backend/app -ll -f sarif -o bandit.sarif || true
      - name: Upload Bandit SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-sarif
          path: bandit.sarif

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: calltone-UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: calltone-UI/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Audit (high+critical only, do not fail PR on transitive dev deps)
        run: |
          npm audit --omit=dev --audit-level=high || {
            echo "::warning::npm audit reported high/critical findings — review before merge."
            exit 0
          }

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
